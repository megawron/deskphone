[general]
static=yes
writeprotect=no

[deskphone-test]
; Extension 600: Echo application (echoes back whatever audio is streamed)
exten => 600,1,NoOp(Echo Application Started for ${CALLERID(all)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Echo()
 same => n,Hangup()

; Extension 700: Milliwatt tone (1000 Hz continuous sine wave)
exten => 700,1,NoOp(Milliwatt Test Tone Started)
 same => n,Answer()
 same => n,Milliwatt()
 same => n,Hangup()

; Extension 1001 & 1002: Dial user endpoints
exten => 1001,1,NoOp(Dialing User 1001)
 same => n,Dial(PJSIP/1001,20)
 same => n,Hangup()

exten => 1002,1,NoOp(Dialing User 1002)
 same => n,Dial(PJSIP/1002,20)
 same => n,Hangup()
