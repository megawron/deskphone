name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install GTK 4, Libadwaita, ALSA, and GNOME validation tools
        run: |
          dnf install -y \
            gcc \
            pkgconf-pkg-config \
            gtk4-devel \
            libadwaita-devel \
            alsa-lib-devel \
            gettext \
            desktop-file-utils \
            appstream \
            meson \
            ninja-build \
            xorg-x11-server-Xvfb \
            python3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate .desktop, AppStream metainfo, DOAP, and translations
        run: |
          desktop-file-validate data/com.martingawron.Deskphone.desktop
          appstreamcli validate --no-net --explain data/com.martingawron.Deskphone.metainfo.xml
          msgfmt --check --statistics -o /dev/null po/de.po
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("deskphone.doap")'

      - name: Run workspace unit tests
        run: xvfb-run -a env LC_ALL=C cargo test --workspace --lib --bins

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu restricts unprivileged user namespaces, which bubblewrap needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=repo build-dir com.martingawron.Deskphone.json
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo com.martingawron.Deskphone.flatpak com.martingawron.Deskphone

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: com.martingawron.Deskphone-x86_64
          path: com.martingawron.Deskphone.flatpak
          if-no-files-found: error
