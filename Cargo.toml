[package]
name = "deskphone"
version = "1.0.0"
edition = "2024"
description = "Modern native SIP and PBX softphone for GNOME"
license = "GPL-3.0-or-later"
homepage = "https://deskphone.martingawron.com"
repository = "https://github.com/megawron/deskphone"

[dependencies]
async-channel = "2.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
gtk4 = { version = "0.11.5", features = ["v4_10"] }
libadwaita = { version = "0.9.2", features = ["v1_8"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
deskphone-core = { path = "crates/deskphone-core" }
ksni = { version = "0.3.6", features = ["blocking"] }
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "background"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[workspace]
members = [
    ".",
    "crates/deskphone-core",
    "crates/deskphone-cli",
]
default-members = ["."]
resolver = "2"

