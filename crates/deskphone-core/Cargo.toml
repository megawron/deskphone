[package]
name = "deskphone-core"
version = "1.0.0"
edition = "2021"
description = "Core headless PBX & Softphone engine (Swyx, Asterisk, Generic SIP) in pure Rust"
license = "GPL-3.0-or-later"
homepage = "https://deskphone.martingawron.com"
repository = "https://github.com/megawron/deskphone"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
md-5 = "0.10"
uuid = { version = "1.8", features = ["v4"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
bytes = "1.6"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
cpal = "0.15"
tokio-tungstenite = "0.23"
futures-util = "0.3"
