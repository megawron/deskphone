name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  flatpak-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu restricts unprivileged user namespaces, which bubblewrap needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=repo build-dir com.martingawron.Deskphone.json
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "Deskphone-${GITHUB_REF_NAME}-x86_64.flatpak" com.martingawron.Deskphone

      - name: Create checksums
        run: sha256sum Deskphone-*.flatpak > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            Deskphone-*.flatpak
            SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Deskphone ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Install the bundle with:

                flatpak install --user Deskphone-${{ github.ref_name }}-x86_64.flatpak

            Verify the download (GitHub CLI):

                gh attestation verify Deskphone-${{ github.ref_name }}-x86_64.flatpak --repo ${{ github.repository }}
          files: |
            Deskphone-*.flatpak
            SHA256SUMS
